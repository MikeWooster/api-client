name: Python test and deploy

on:
  release:
    types: [published]


jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,lint]
      - name: Lint Checks
        run: |
          isort apiclient tests --check-only
          black --check apiclient tests
          flake8 apiclient tests
      - name: Unit Tests
        run: |
          pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Set Up Build
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check VERSION matches the release tag
        run: |
          version="$(cat VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "VERSION ($version) does not match release tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
      - name: Build Dist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # Trusted Publishing (OIDC): the repo is registered as a publisher on PyPI (api-client -> Settings -> Publishing) for the `pypi` environment.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
