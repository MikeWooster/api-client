name: Python test and deploy

on:
  release:
    types: [created]


jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,lint]
      - name: Lint Checks
        run: |
          isort apiclient tests --check-only
          black --check apiclient tests
          flake8 apiclient tests
      - name: Unit Tests
        run: |
          pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set Up Build
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[deploy]
      - name: Update RC Version
        run: |
          python scripts/update_version.py ${GITHUB_REF}
      - name: Build Dist
        run: |
          rm -rf dist/*
          python setup.py sdist
      - name: Publish
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python scripts/upload_new_package.py
